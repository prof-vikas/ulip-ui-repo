<div class="sidenav-scrim" *ngIf="layout.mobileOpen()" (click)="layout.closeMobile()"></div>

<nav class="sidenav" [class.collapsed]="layout.collapsed()" [class.mobile-open]="layout.mobileOpen()" aria-label="Main">
  <div class="sidenav-header">
    <a class="brand" routerLink="/dashboard" aria-label="Gativra — home">
      <img class="brand-logo light-only" src="brand/gativra-logo.svg" alt="Gativra — Powering Smart Logistics" />
      <img class="brand-logo dark-only" src="brand/gativra-logo-dark.svg" alt="Gativra — Powering Smart Logistics" />
      <img class="brand-mark" src="favicon.svg" alt="Gativra" />
    </a>
    <button type="button" class="collapse-btn" (click)="layout.toggleCollapsed()"
            [attr.aria-label]="layout.collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
            [title]="layout.collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <app-icon [name]="layout.collapsed() ? 'chevron-right' : 'chevron-left'" [size]="16"></app-icon>
    </button>
  </div>

  <div class="nav-scroll">
    <div class="nav-section" *ngFor="let section of sections()">
      <div class="nav-section-label">{{ section.label }}</div>
      <ul class="nav-list">
        <li *ngFor="let item of section.items" class="nav-item-wrapper">
          <!-- Parent with sub-pages (Vahan, ICE GATE) -->
          <ng-container *ngIf="item.children.length; else leaf">
            <button type="button" class="nav-item"
                    [class.nav-item-active-parent]="isParentActive(item)"
                    [attr.aria-expanded]="expanded.has(item.code)"
                    [title]="item.label"
                    (click)="toggle(item)">
              <span class="nav-icon"><app-icon [name]="item.icon"></app-icon></span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="nav-arrow" [class.rotated]="expanded.has(item.code)">
                <app-icon name="chevron-right" [size]="14"></app-icon>
              </span>
            </button>
            <ul class="sub-menu" [class.open]="expanded.has(item.code) && !layout.collapsed()">
              <li *ngFor="let child of item.children">
                <a class="nav-item sub-item" [routerLink]="child.route" [class.nav-item-active]="isActive(child)">
                  <span class="sub-dot"></span>
                  <span class="nav-label">{{ child.label }}</span>
                </a>
              </li>
            </ul>
          </ng-container>

          <ng-template #leaf>
            <a class="nav-item" [routerLink]="item.route" [class.nav-item-active]="isActive(item)" [title]="item.label">
              <span class="nav-icon">
                <app-icon [name]="item.icon"></app-icon>
                <span class="nav-dot" *ngIf="badgeFor(item.code) as n" [attr.data-kind]="item.code"></span>
              </span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="nav-badge" *ngIf="badgeFor(item.code) as n" [attr.data-kind]="item.code"
                    [title]="item.code === 'ADMIN_APPROVALS' ? n + ' waiting for review' : n + ' awaiting approval'">{{ n > 99 ? '99+' : n }}</span>
            </a>
          </ng-template>
        </li>
      </ul>
    </div>

    <div class="nav-empty" *ngIf="!sections().length">No pages are assigned to your role yet.</div>
  </div>

  <div class="sidenav-footer">
    <div class="user-info">
      <div class="user-avatar">{{ initials() }}</div>
      <div class="user-details">
        <span class="user-name">{{ user()?.name || user()?.username }}</span>
        <span class="user-role">{{ (user()?.role || '') | titlecase }}</span>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()" title="Sign out" aria-label="Sign out">
      <app-icon name="logout" [size]="16"></app-icon>
    </button>
  </div>
</nav>
