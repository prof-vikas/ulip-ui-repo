<nav class="sidenav">
  <div class="sidenav-header">
    <div class="logo-wrap">
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="url(#sidenavLogoGrad)"/>
        <path d="M8 20L20 8L32 20L20 32L8 20Z" fill="white" opacity="0.95"/>
        <circle cx="20" cy="20" r="5" fill="#4F46E5"/>
        <defs>
          <linearGradient id="sidenavLogoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4F46E5"/>
            <stop offset="1" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="logo-text">
      <span class="logo-title">SIPL</span>
      <span class="logo-sub">API Library</span>
    </div>
  </div>

  <div class="nav-section-label">MAIN MENU</div>

  <ul class="nav-list">
    <li *ngFor="let item of navItems" class="nav-item-wrapper">
      <!-- Parent item with children (Vahan) -->
      <div
        *ngIf="item.children"
        class="nav-item"
        [class.nav-item-active-parent]="isParentActive(item) || item.expanded"
        (click)="toggleExpand(item)"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
        <span class="nav-arrow" [class.rotated]="item.expanded">&#8250;</span>
      </div>

      <!-- Sub-menu -->
      <ul class="sub-menu" [class.open]="item.expanded">
        <li *ngFor="let child of item.children">
          <div
            class="nav-item sub-item"
            [class.nav-item-active]="isActive(child.route!)"
            (click)="navigate(child.route!)"
          >
            <span class="sub-dot"></span>
            <span class="nav-label">{{ child.label }}</span>
          </div>
        </li>
      </ul>

      <!-- Leaf item (no children) -->
      <div
        *ngIf="!item.children"
        class="nav-item"
        [class.nav-item-active]="isActive(item.route!)"
        (click)="navigate(item.route!)"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </div>
    </li>
  </ul>

  <div class="sidenav-theme-row">
    <span class="theme-row-label">Appearance</span>
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="sidenav-footer">
    <div class="user-info">
      <div class="user-avatar">{{ (userName || 'U').charAt(0).toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">Operator</span>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()" title="Sign out">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>
      </svg>
    </button>
  </div>
</nav>
