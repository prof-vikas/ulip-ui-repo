<div class="page-container">


  <div class="page-header">
    <div class="breadcrumb">Vahan</div>
    <h1 class="page-title">Vahan APIs</h1>
    <p class="page-desc">Select an API below to query vehicle registration details from the Vahan database.</p>
  </div>

  <div class="cards-grid">
    <div
      class="api-card"
      *ngFor="let card of cards"
      [class.card-available]="card.available"
      [class.card-pending]="!card.available"
    >
      <div class="card-top">
        <div class="card-badge" [class.badge-live]="card.available" [class.badge-pending]="!card.available">
          {{ card.available ? 'Live' : 'Pending' }}
        </div>
        <div class="card-id">{{ card.title }}</div>
      </div>

      <p class="card-desc">{{ card.desc }}</p>

      <div class="card-input-info">
        <span class="input-tag">{{ card.tag }}</span>
        <span class="input-example">{{ card.inputExample }}</span>
      </div>

      <div class="card-footer">
        <button
          class="btn-open"
          [class.btn-disabled]="!card.available"
          (click)="card.available && openApi(card.id)"
          [disabled]="!card.available"
        >
          <span *ngIf="card.available">Open API &rarr;</span>
          <span *ngIf="!card.available">Coming Soon</span>
        </button>
      </div>
    </div>
  </div>

</div>
